name: bounded-rest-evidence-audit
on:
  pull_request:
    branches: [main]
    paths: ['research/rest-evidence-v1/**', '.github/workflows/rest-evidence-audit.yml']
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Bounded public read-only sample, no credentials or production state
        run: python research/rest-evidence-v1/probe.py
      - name: Analyze with frozen source identity and decoder functions
        run: node --import tsx research/rest-evidence-v1/analyze.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-rest-evidence-v1
          path: research/rest-evidence-v1/evidence
          retention-days: 14
