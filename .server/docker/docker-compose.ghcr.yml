# =============================================================================
# Polymarket Copy Trade — Production Docker Compose (GHCR Images)
# =============================================================================
# Usage:
#   IMAGE_TAG=latest docker compose -f docker-compose.ghcr.yml up -d
#
# Optional profiles:
#   IMAGE_TAG=latest docker compose -f docker-compose.ghcr.yml --profile arb --profile scalp up -d
#
# Secrets (in ./secrets/ directory):
#   - env.txt         (all env vars, one per line: KEY=value)
#   - pg_password.txt (PostgreSQL password, single line)

x-worker-base: &worker-base
  image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-mantotan}/polymarket-copy-trade:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - ./secrets/env.txt
  environment:
    NODE_ENV: production
  volumes:
    - polymarket_logs:/app/logs
  networks:
    - polymarket-network
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  # ===========================================================================
  # Infrastructure
  # ===========================================================================

  polymarket_postgres:
    image: postgres:16-alpine
    container_name: polymarket_postgres
    restart: always
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "random_page_cost=1.1"
    environment:
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: polymarket_copytrade
    volumes:
      - polymarket_pgdata:/var/lib/postgresql/data
      - ./secrets/pg_password.txt:/run/secrets/pg_password:ro
    ports:
      - "127.0.0.1:5438:5432"
    networks:
      - polymarket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket -d polymarket_copytrade"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2560M

  # ===========================================================================
  # Database Migrations (one-shot)
  # ===========================================================================

  migrate:
    <<: *worker-base
    container_name: polymarket_migrate
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["npx prisma migrate deploy && echo 'Migrations complete'"]
    depends_on:
      polymarket_postgres:
        condition: service_healthy

  # ===========================================================================
  # Daemon Workers
  # ===========================================================================

  ipc-bridge:
    <<: *worker-base
    container_name: polymarket_ipc_bridge
    command: ["src/jobs/ipc-bridge.ts"]
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      IPC_SOCKET_PATH: /var/run/copier/copier.sock
    volumes:
      - polymarket_logs:/app/logs
      - copier_ipc:/var/run/copier
    profiles:
      - copier
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/copier/copier.sock"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s
    deploy:
      resources:
        limits:
          memory: 512M

  trade-monitor:
    <<: *worker-base
    container_name: polymarket_trade_monitor
    command: ["src/jobs/trade-monitor.ts"]
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
    deploy:
      resources:
        limits:
          memory: 512M

  history-backfiller:
    <<: *worker-base
    container_name: polymarket_history_backfiller
    command: ["src/jobs/history-backfiller.ts"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1536
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M

  # ===========================================================================
  # Scheduled Workers (sleep-loop replicating PM2 cron_restart)
  # Note: $$ in YAML = literal $ in shell (docker compose escaping).
  # ===========================================================================

  leaderboard-scanner:
    <<: *worker-base
    container_name: polymarket_leaderboard_scanner
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          node --import tsx src/jobs/leaderboard-scanner.ts
          EXIT_CODE=$$?
          if [ $$EXIT_CODE -ne 0 ]; then
            echo "leaderboard-scanner failed (exit $$EXIT_CODE), retrying in 5m..."
            sleep 300
          else
            echo "leaderboard-scanner complete, sleeping 12h..."
            sleep 43200
          fi
        done
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  score-calculator:
    <<: *worker-base
    container_name: polymarket_score_calculator
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          node --max-old-space-size=1280 --import tsx src/jobs/score-calculator.ts
          EXIT_CODE=$$?
          if [ $$EXIT_CODE -ne 0 ]; then
            echo "score-calculator failed (exit $$EXIT_CODE), retrying in 5m..."
            sleep 300
          else
            echo "score-calculator complete, sleeping 6h..."
            sleep 21600
          fi
        done
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 1536M

  # ===========================================================================
  # Optional Workers (activate via --profile arb / --profile scalp)
  # ===========================================================================

  arb-worker:
    <<: *worker-base
    container_name: polymarket_arb_worker
    command: ["src/jobs/arb-worker.ts"]
    stop_grace_period: 45s
    profiles:
      - arb
    deploy:
      resources:
        limits:
          memory: 512M

  scalp-worker:
    <<: *worker-base
    container_name: polymarket_scalp_worker
    command: ["src/jobs/scalp-worker.ts"]
    stop_grace_period: 45s
    profiles:
      - scalp
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  # Rust Copier (V2 hot path — activate via --profile copier)
  # ===========================================================================

  copier:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-mantotan}/polymarket-copier:${IMAGE_TAG:-latest}
    container_name: polymarket_copier
    restart: unless-stopped
    env_file:
      - ./secrets/env.txt
    environment:
      IPC_SOCKET_PATH: /var/run/copier/copier.sock
      RUST_LOG: polymarket_copier=info
    volumes:
      - copier_ipc:/var/run/copier
      - price_data:/data/prices
    networks:
      - polymarket-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      ipc-bridge:
        condition: service_healthy
    stop_grace_period: 10s
    profiles:
      - copier
    deploy:
      resources:
        limits:
          memory: 256M

# =============================================================================
# Volumes
# =============================================================================
volumes:
  polymarket_pgdata:
    driver: local
    name: polymarket_pgdata
  polymarket_logs:
    driver: local
    name: polymarket_logs
  copier_ipc:
    driver: local
  price_data:
    driver: local
    name: polymarket_price_data

# =============================================================================
# Networks
# =============================================================================
networks:
  polymarket-network:
    driver: bridge
